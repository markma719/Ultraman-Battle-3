
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultraman Phonics Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap');
      
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #000;
        color: white;
        overflow: hidden; 
        user-select: none;
      }

      .font-arcade {
        font-family: 'Black Ops One', system-ui;
      }

      /* --- Wide Beam Attack (Heavy) --- */
      @keyframes wideBeam {
        0% { width: 0; opacity: 0.5; filter: hue-rotate(0deg); }
        20% { width: 120%; opacity: 1; height: 60px; }
        80% { width: 120%; opacity: 1; height: 40px; filter: hue-rotate(90deg); }
        100% { width: 0; opacity: 0; left: 120%; height: 10px;}
      }

      .beam-attack {
        position: absolute;
        height: 50px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, #00e5ff 30%, #0099cc 70%, rgba(255,255,255,0.9) 100%);
        box-shadow: 0 0 50px #00e5ff, inset 0 0 30px #fff;
        z-index: 40;
        border-radius: 25px;
        animation: wideBeam 0.5s ease-out forwards;
        transform-origin: left center;
        mix-blend-mode: screen;
      }

      /* --- Emerium Beam Attack (Fast/Green) --- */
      @keyframes emeriumShot {
        0% { width: 0; opacity: 1; }
        50% { width: 100vw; opacity: 1; }
        100% { width: 100vw; opacity: 0; }
      }

      .emerium-beam {
        position: absolute;
        height: 6px;
        background: #00ff00;
        box-shadow: 0 0 15px #00ff00, 0 0 5px #fff;
        z-index: 40;
        animation: emeriumShot 0.4s linear forwards;
        transform-origin: left center;
      }

      /* --- Slugger Attack (Rotating) --- */
      @keyframes throwSlugger {
         0% { transform: translateX(0) rotate(0deg) scale(0.5); }
         100% { transform: translateX(80vw) rotate(1080deg) scale(1.2); }
      }

      .slugger-projectile {
        position: absolute;
        width: 60px;
        height: 60px;
        /* Simple crescent shape via borders */
        border-radius: 50%;
        border-top: 8px solid #silver;
        border-right: 8px solid #fff;
        border-bottom: 2px solid transparent;
        border-left: 2px solid transparent;
        box-shadow: 0 0 20px #00e5ff;
        z-index: 40;
        animation: throwSlugger 0.6s ease-in forwards;
      }

      /* --- Monster Attack (Fireball/Dark) --- */
      @keyframes darkShot {
        0% { transform: translateX(0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateX(-100vw) scale(1.5); opacity: 0; }
      }

      .monster-attack {
        position: absolute;
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, #ff0000, #500000, #000);
        border-radius: 50%;
        box-shadow: 0 0 50px #ff0000;
        z-index: 40;
        animation: darkShot 0.8s ease-in forwards;
        mix-blend-mode: screen;
      }

      /* --- Damage Shake --- */
      @keyframes shake {
        0% { transform: translate(0, 0) rotate(0deg); filter: brightness(1); }
        20% { transform: translate(10px, 10px) rotate(5deg); filter: brightness(3) sepia(1) hue-rotate(-50deg) saturate(5); }
        40% { transform: translate(-10px, -10px) rotate(-5deg); filter: brightness(1); }
        60% { transform: translate(10px, -10px) rotate(5deg); filter: brightness(3) sepia(1) hue-rotate(-50deg) saturate(5); }
        100% { transform: translate(0, 0) rotate(0deg); filter: brightness(1); }
      }

      .shake-anim {
        animation: shake 0.5s;
      }

      /* --- Idle Float --- */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }

      .float-anim {
        animation: float 3s ease-in-out infinite;
      }

      /* --- Hit Number Popup --- */
      @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
      }
      
      .damage-text {
        position: absolute;
        font-family: 'Black Ops One', sans-serif;
        animation: floatUp 1s forwards;
        pointer-events: none;
        z-index: 50;
        text-shadow: 3px 3px 0 #000;
      }
    </style>

{

}
</script>
</head>

  </body>
</html>
